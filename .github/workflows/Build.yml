name: TurnIt-IDE Native Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
 
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      
    - name: Build Toybox (aarch64)
      run: |
        echo "Setting up NDK Toolchain..."
        export NDK=$ANDROID_NDK_HOME
        export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
        export TARGET=aarch64-linux-android
        export API=28

        export CC="$TOOLCHAIN/bin/$TARGET$API-clang"
        export CXX="$TOOLCHAIN/bin/$TARGET$API-clang++"
        export AR="$TOOLCHAIN/bin/llvm-ar"
        export STRIP="$TOOLCHAIN/bin/llvm-strip"
        export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"

        echo "Cloning Toybox..."
        git clone https://github.com/landley/toybox.git
        cd toybox

        echo "Configuring and Building Toybox..."
        make defconfig

        # Disable Linux Standard Base tools that require the missing 'crypt' function on Android
        sed -i 's/CONFIG_SU=y/# CONFIG_SU is not set/' .config
        sed -i 's/CONFIG_PASSWD=y/# CONFIG_PASSWD is not set/' .config
        sed -i 's/CONFIG_LOGIN=y/# CONFIG_LOGIN is not set/' .config
        sed -i 's/CONFIG_USERADD=y/# CONFIG_USERADD is not set/' .config
        sed -i 's/CONFIG_USERDEL=y/# CONFIG_USERDEL is not set/' .config
        LDFLAGS="--static" make toybox -j$(nproc)

        echo "Staging binary for Android Package Manager..."
        mkdir -p ../app/src/main/jniLibs/arm64-v8a/
        # We rename the executable to .so so Android's PackageManager extracts it with X_OK permissions natively
        cp toybox-aarch64-linux-android ../app/src/main/jniLibs/arm64-v8a/libtoybox.so

        echo "Toybox build complete!"
        
    - name: Build Android Release/Debug
      run: ./gradlew assembleDebug
