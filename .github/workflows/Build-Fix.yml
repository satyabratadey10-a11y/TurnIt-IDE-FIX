name: TurnIt-IDE Native Build (Cache Buster)

on:
  workflow_dispatch: 
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main # Force explicit checkout of main branch

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # CRITICAL: We REMOVED the 'cache: gradle' line here to prevent loading old state.

    - name: Compile lib7zr.so (Android ARM64) via NDK
      run: |
        echo "Downloading p7zip source..."
        wget -q -O p7zip.tar.bz2 https://sourceforge.net/projects/p7zip/files/p7zip/16.02/p7zip_16.02_src_all.tar.bz2
        tar -xf p7zip.tar.bz2
        cd p7zip_16.02
        
        echo "Patching Bionic libc missing getpass..."
        sed -i 's/getpass("")/""/g' CPP/7zip/UI/Console/UserInputUtils.cpp
        
        # Use the generic CPU makefile
        cp makefile.linux_any_cpu makefile.machine
        
        echo "Patching Android NDK Linker..."
        sed -i 's/-lpthread//g' makefile.machine
        sed -i 's/-lrt//g' makefile.machine
        
        echo "Cross-compiling for Android ARM64..."
        export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
        export TARGET=aarch64-linux-android26
        
        make 7zr \
          CC="$TOOLCHAIN/bin/$TARGET-clang" \
          CXX="$TOOLCHAIN/bin/$TARGET-clang++ -Wno-c++11-narrowing" \
          STRIP="$TOOLCHAIN/bin/llvm-strip"
          
        echo "Injecting native binary into APK..."
        mkdir -p $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
        cp bin/7zr $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/lib7zr.so
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Inject google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
      
    - name: Hack PRoot Dependencies for Android Linker
      run: |
        sudo apt-get update && sudo apt-get install -y patchelf
        
        # Navigate to the user's uploaded JNI libs
        cd app/src/main/jniLibs/arm64-v8a/
        
        echo "Fetching latest libtalloc from Termux repositories..."
        TALLOC_DEB=$(curl -sL https://packages.termux.dev/apt/termux-main/pool/main/t/talloc/ | grep -o 'talloc_[0-9\.\-]*_aarch64.deb' | head -n 1)
        wget -q "https://packages.termux.dev/apt/termux-main/pool/main/t/talloc/$TALLOC_DEB"
        
        echo "Extracting binary..."
        dpkg-deb -x "$TALLOC_DEB" talloc_out
        
        echo "Injecting into TurnIt and renaming for Android packaging..."
        cp talloc_out/data/data/com.termux/files/usr/lib/libtalloc.so.2 ./libtalloc.so
        rm -rf "$TALLOC_DEB" talloc_out
        
        echo "Binary hacking libproot.so ELF header..."
        patchelf --replace-needed libtalloc.so.2 libtalloc.so libproot.so

    - name: Build Debug APK (Strict Cache Busting)
      # CRITICAL: Added Claude's strict flags to force 100% recompilation of all files
      run: ./gradlew clean :app:assembleDebug --no-build-cache --no-configuration-cache --rerun-tasks

    - name: Upload IDE APK
      uses: actions/upload-artifact@v4
      with:
        name: TurnIt-IDE-Ultimate-Clean
        path: app/build/outputs/apk/debug/app-debug.apk
