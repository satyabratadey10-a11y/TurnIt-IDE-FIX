name: Sync Assets and Code from Original Repo

on:
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

permissions:
  contents: write

jobs:
  migrate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      - name: Clone v2-bypass-clean from Original Repository
        run: |
          echo "Cloning original repository..."
          git clone --branch v2-bypass-clean https://github.com/satyabratadey10-a11y/TurnIt-IDE.git temp_old_repo
          
          echo "Syncing files to current repository..."
          # rsync copies everything EXCEPT the old .git history to avoid conflicts
          rsync -av --exclude='.git' --exclude='.github' temp_old_repo/ ./
          rm -rf temp_old_repo

      - name: Commit and push assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force tracking of the assets folder as requested
          git add app/src/main/assets/
          
          # CRITICAL ADDITION: We must also add the source code and JNI libs
          # If we only add assets, your new ShellEngine.kt and libproot.so will be left behind.
          git add app/src/main/java/
          git add app/src/main/jniLibs/
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: Bundle Ubuntu RootFS and static PRoot via CI/CD"
            git push
          else
            echo "No asset changes detected; skipping commit and push."
          fi
