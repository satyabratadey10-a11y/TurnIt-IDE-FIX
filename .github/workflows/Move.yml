name: Sync Assets and Code from Original Repo

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  migrate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      - name: Clone v2-bypass-clean from Original Repository
        run: |
          echo "Cloning original repository..."
          git clone --branch v2-bypass-clean https://github.com/satyabratadey10-a11y/TurnIt-IDE.git temp_old_repo
          
          echo "Syncing files to current repository..."
          rsync -av --exclude='.git' --exclude='.github' temp_old_repo/ ./
          rm -rf temp_old_repo

      - name: Commit and push everything
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # THE FIX: This single command adds ALL root files, Gradle wrappers, and app source code
          git add -A
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: Full repository migration including Gradle build files"
            git push
          else
            echo "No changes detected; skipping commit and push."
          fi
